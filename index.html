<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Scan foto makanan untuk estimasi kalori dan nutrisi. Bagian dari ekosistem kesehatan 20FIT." />
    <!-- Neutral fallback (pre-JS / JS-disabled) — matches --bg (page
         background) light in index.css, not the header's own fill: the
         header floats with margin around it now (see .ct-header-bar in
         App.tsx), so the page background is what's actually flush against
         the browser chrome. Never brand red either way. The inline script
         below overwrites this synchronously to the resolved theme's color
         before first paint. -->
    <meta name="theme-color" content="#EFEDEA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Scan Kalori • 20FIT</title>
    <script>
      // Set the theme BEFORE first paint so there is no flash of the wrong
      // palette. Mirrors src/lib/theme.tsx (localStorage["theme"] → OS pref →
      // light). Kept inline + synchronous on purpose. Also flips the
      // theme-color meta here (not just in theme.tsx) so the browser's own
      // chrome (address bar / status bar) matches the page background from
      // the very first frame, not just after React hydrates.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "dark" ? "#131410" : "#EFEDEA");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
