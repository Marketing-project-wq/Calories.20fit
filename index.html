<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Scan foto makanan untuk estimasi kalori dan nutrisi. Bagian dari ekosistem kesehatan 20FIT." />
    <!-- Neutral fallback (pre-JS / JS-disabled) — matches --bg (page
         background) light in index.css, not the header's own fill: the
         header floats with margin around it now (see .ct-header-bar in
         App.tsx), so the page background is what's actually flush against
         the browser chrome. Never brand red either way. The inline script
         below overwrites this synchronously to the resolved theme's color
         before first paint. -->
    <meta name="theme-color" content="#EFEDEA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Scan Kalori • 20FIT</title>
    <script>
      // Set the theme BEFORE first paint so there is no flash of the wrong
      // palette. Mirrors src/lib/theme.tsx (localStorage["theme"] → OS pref →
      // light). Kept inline + synchronous on purpose. Also flips the
      // theme-color meta here (not just in theme.tsx) so the browser's own
      // chrome (address bar / status bar) matches the page background from
      // the very first frame, not just after React hydrates.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "dark" ? "#131410" : "#EFEDEA");

          // Kick off the header logo's fetch here, before the JS bundle even
          // loads, so it's already in flight (or served from HTTP cache) by
          // the time App.tsx renders <img src={LOGO[theme]}> — this is the
          // network-side mitigation for the "logo flashes in on reload"
          // request; it's still a real network image (this app has no build
          // step available in its sandbox to embed the actual PNG bytes as
          // a data URI — ask if you'd rather send the two logo files
          // directly so that can be done too). Must stay in sync with
          // src/lib/theme.tsx's LOGO map.
          var LOGO_URLS = {
            light: "https://media.20fit.id/wp-content/uploads/2026/05/Logo-20fit.png",
            dark: "https://media.20fit.id/wp-content/uploads/2026/07/Copy-of-new-logo-20fit-putih-3.png",
          };
          var preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = LOGO_URLS[t];
          preload.fetchPriority = "high";
          document.head.appendChild(preload);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
